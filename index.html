<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JUDGE — Denim</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid #e5e5e5;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -2px;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 13px;
      text-transform: uppercase;
    }

    .icons {
      display: flex;
      gap: 20px;
      font-size: 13px;
    }

    .hero {
      height: calc(100vh - 70px);
      min-height: 600px;
      background: #e9e9e9;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .hero-content h1 {
      font-size: clamp(55px, 10vw, 150px);
      letter-spacing: -8px;
      font-weight: 800;
    }

    .hero-content p {
      margin-top: 15px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hero-content button {
      margin-top: 30px;
      background: #111;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .collection {
      padding: 100px 40px;
    }

    .collection-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .collection h2 {
      font-size: 28px;
      font-weight: 500;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-image {
      background: #e5e5e5;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #777;
    }

    .product-info {
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 40px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 20px;
      }

      nav {
        display: none;
      }

      .collection {
        padding: 60px 20px;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .hero-content h1 {
        letter-spacing: -4px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">JUDGE</div>

    <nav>
      <a href="#">Shop</a>
      <a href="#">New Arrivals</a>
      <a href="#">About</a>
    </nav>

    <div class="icons">
      <span>Search</span>
      <span>Bag (0)</span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>JUDGE</h1>
      <p>DENIM WITHOUT PERMISSION</p>
      <button>Shop Collection</button>
    </div>
  </section>

  <section class="collection">

    <div class="collection-header">
      <h2>New Arrivals</h2>
      <span>View All</span>
    </div>

    <div class="products">

      <div class="product">
        <div class="product-image">PRODUCT IMAGE</div>
        <div class="product-info">
          <span>JUDGE Denim 001</span>
          <span>₹2,499</span>
        </div>
      </div>

      <div class="product">
        <div class="product-image">PRODUCT IMAGE</div>
        <div class="product-info">
          <span>JUDGE Denim 002</span>
          <span>₹2,799</span>
        </div>
      </div>

      <div class="product">
        <div class="product-image">PRODUCT IMAGE</div>
        <div class="product-info">
          <span>JUDGE Denim 003</span>
          <span>₹2,999</span>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <span>© 2026 JUDGE</span>
    <span>India</span>
  </footer>

</body>
</html>
