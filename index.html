<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JUDGE — Official Store</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #111;
  background: #fff;
}

header {
  height: 82px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}

.nav-left,
.nav-right {
  display: flex;
  gap: 22px;
  font-size: 11px;
  letter-spacing: 0.5px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -2px;
}

a {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
}

.collection {
  padding: 25px 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  padding: 0 28px 20px;
  font-size: 12px;
  letter-spacing: 0.5px;
}

.products {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.product {
  cursor: pointer;
}

.product-image {
  width: 100%;
  height: 650px;
  overflow: hidden;
  background: #eee;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.product:hover img {
  transform: scale(1.02);
}

.product-info {
  display: flex;
  justify-content: space-between;
  padding: 10px 5px;
  font-size: 11px;
}

/* PRODUCT PAGE */

.product-page {
  display: none;
  padding: 35px 28px;
}

.back {
  font-size: 11px;
  cursor: pointer;
  margin-bottom: 25px;
  display: inline-block;
}

.product-detail {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 50px;
}

.detail-image img {
  width: 100%;
  max-height: 800px;
  object-fit: cover;
}

.detail-info {
  padding-top: 10px;
}

.detail-name {
  font-size: 14px;
  margin-bottom: 12px;
}

.detail-price {
  font-size: 13px;
  margin-bottom: 35px;
}

.sizes {
  display: flex;
  gap: 8px;
  margin: 15px 0 25px;
}

.size {
  border: 1px solid #aaa;
  padding: 12px 16px;
  font-size: 11px;
  cursor: pointer;
}

.size.selected {
  background: #111;
  color: white;
}

.add-btn {
  width: 100%;
  background: #111;
  color: white;
  border: none;
  padding: 18px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 1px;
}

.description {
  margin-top: 30px;
  font-size: 12px;
  line-height: 1.6;
  color: #555;
}

/* BAG */

.bag-panel {
  position: fixed;
  top: 0;
  right: -450px;
  width: 420px;
  max-width: 100%;
  height: 100vh;
  background: white;
  border-left: 1px solid #ddd;
  z-index: 10;
  padding: 30px;
  transition: right 0.3s ease;
}

.bag-panel.open {
  right: 0;
}

.bag-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 30px;
}

.bag-item {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
}

.bag-item img {
  width: 90px;
  height: 110px;
  object-fit: cover;
}

.remove {
  font-size: 10px;
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
  text-decoration: underline;
}

.checkout {
  position: absolute;
  bottom: 30px;
  left: 30px;
  right: 30px;
  background: #111;
  color: white;
  border: none;
  padding: 18px;
  cursor: pointer;
}

@media (max-width: 700px) {

  header {
    padding: 0 15px;
  }

  .products {
    grid-template-columns: 1fr;
  }

  .product-image {
    height: 600px;
  }

  .product-detail {
    grid-template-columns: 1fr;
  }

  .product-page {
    padding: 20px 15px;
  }

  .logo {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav-left">
    <a>SHOP</a>
    <a>ABOUT</a>
  </div>

  <div class="logo">JUDGE</div>

  <div class="nav-right">
    <a>SEARCH</a>
    <a onclick="openBag()">BAG (<span id="bag-count">0</span>)</a>
  </div>
</header>


<!-- SHOP -->

<div id="shop-page">

<section class="collection">

<div class="section-head">
  <span>DROP 001 / NEW ARRIVALS</span>
  <span>VIEW ALL</span>
</div>

<div class="products">

  <article class="product" onclick="openProduct(0)">
    <div class="product-image">
      <img src="judge-001-front.jpeg">
    </div>
    <div class="product-info">
      <span>₹2,499 &nbsp; JUDGE / 001</span>
    </div>
  </article>

  <article class="product" onclick="openProduct(1)">
    <div class="product-image">
      <img src="judge-002-front.jpeg">
    </div>
    <div class="product-info">
      <span>₹2,799 &nbsp; JUDGE / 002</span>
    </div>
  </article>

  <article class="product" onclick="openProduct(2)">
    <div class="product-image">
      <img src="judge-003-front.jpeg">
    </div>
    <div class="product-info">
      <span>₹2,799 &nbsp; JUDGE / 003</span>
    </div>
  </article>

</div>

</section>
</div>


<!-- PRODUCT DETAIL -->

<div id="product-page" class="product-page">

<div class="back" onclick="goBack()">← BACK TO SHOP</div>

<div class="product-detail">

  <div class="detail-image">
    <img id="detail-img">
  </div>

  <div class="detail-info">

    <div class="detail-name" id="detail-name"></div>

    <div class="detail-price" id="detail-price"></div>

    <div style="font-size:11px;">SELECT SIZE</div>

    <div class="sizes">
      <div class="size" onclick="selectSize(this)">S</div>
      <div class="size" onclick="selectSize(this)">M</div>
      <div class="size" onclick="selectSize(this)">L</div>
      <div class="size" onclick="selectSize(this)">XL</div>
    </div>

    <button class="add-btn" onclick="addToBag()">ADD TO BAG</button>

    <div class="description">
      Wide-leg denim.<br>
      Relaxed fit.<br>
      JUDGE DROP 001.
    </div>

  </div>

</div>
</div>


<!-- BAG -->

<div id="bag" class="bag-panel">

<div class="bag-header">
  <strong>BAG</strong>
  <span style="cursor:pointer" onclick="closeBag()">×</span>
</div>

<div id="bag-items"></div>

<button class="checkout">CHECKOUT</button>

</div>


<script>

const products = [

  {
    name: "JUDGE / 001",
    price: "₹2,499",
    image: "judge-001-front.jpeg"
  },

  {
    name: "JUDGE / 002",
    price: "₹2,799",
    image: "judge-002-front.jpeg"
  },

  {
    name: "JUDGE / 003",
    price: "₹2,799",
    image: "judge-003-front.jpeg"
  }

];

let currentProduct = null;
let selectedSize = null;
let bag = [];


function openProduct(index) {

  currentProduct = products[index];

  document.getElementById("shop-page").style.display = "none";
  document.getElementById("product-page").style.display = "block";

  document.getElementById("detail-img").src = currentProduct.image;
  document.getElementById("detail-name").innerText = currentProduct.name;
  document.getElementById("detail-price").innerText = currentProduct.price;

  selectedSize = null;

  document.querySelectorAll(".size").forEach(size => {
    size.classList.remove("selected");
  });

  window.scrollTo(0, 0);
}


function goBack() {
    document.getElementById("product-page").style.display = "none";
    document.getElementById("shop-page").style.display = "block";
    document.getElementById("bag").classList.remove("open");
    window.scrollTo(0, 0);
}


function selectSize(element) {

  document.querySelectorAll(".size").forEach(size => {
    size.classList.remove("selected");
  });

  element.classList.add("selected");

  selectedSize = element.innerText;

}


function addToBag() {

  if (!selectedSize) {
    alert("SELECT A SIZE");
    return;
  }

  bag.push({
    ...currentProduct,
    size: selectedSize
  });

  updateBag();

  openBag();

}


function updateBag() {

  document.getElementById("bag-count").innerText = bag.length;

  const bagItems = document.getElementById("bag-items");

  bagItems.innerHTML = "";

  bag.forEach((item, index) => {

    bagItems.innerHTML += `

      <div class="bag-item">

        <img src="${item.image}">

        <div>

          <div style="font-size:12px">${item.name}</div>

          <div style="font-size:11px; margin-top:5px">
            ${item.price}
          </div>

          <div style="font-size:11px; margin-top:5px">
            SIZE ${item.size}
          </div>

          <span class="remove" onclick="removeItem(${index})">
            REMOVE
          </span>

        </div>

      </div>

    `;

  });

}


function removeItem(index) {

  bag.splice(index, 1);

  updateBag();

}


function openBag() {

  document.getElementById("bag").classList.add("open");

}


function closeBag() {
  document.getElementById("bag").classList.remove("open");
}
  document.addEventListener("click", function(event) {
    const bag = document.getElementById("bag");

    if (
        bag.classList.contains("open") &&
        !bag.contains(event.target) &&
        !event.target.closest('[onclick="openBag()"]')
    ) {
        closeBag();
    }
});

</script>

</body>
</html>
